# 打包配置
# main / preload / renderer 都由 esbuild 与 Vite 打包，运行时不需要 node_modules，
# 所以显式排除它——避免把 pnpm 的符号链接结构塞进 asar
appId: com.piagent.desktop
productName: Pi Agent Desktop

directories:
  output: release
  buildResources: assets

# 主进程保留 @earendil-works/* 为外部依赖（内联会破坏它们的 ESM 循环引用），
# 所以必须把生产依赖一起打进 asar，否则打包后只能“借用”仓库里的 node_modules。
files:
  - dist/**/*
  - package.json
  - node_modules/**/*

asar: true

# 产物只含 dist，运行时不需要 node_modules，跳过依赖重建显著加快打包
npmRebuild: false

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  # 由 assets/make-icon.py 生成，同样文件也满足 buildResources 自动探测
  icon: assets/icon.icns

win:
  target:
    - nsis
  icon: assets/icon.ico
