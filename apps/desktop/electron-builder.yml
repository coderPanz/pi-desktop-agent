# 打包配置
# main / preload / renderer 都由 esbuild 与 Vite 打包，运行时不需要 node_modules，
# 所以显式排除它——避免把 pnpm 的符号链接结构塞进 asar
appId: com.piagent.desktop
productName: Pi Agent Desktop

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  - "!node_modules/**/*"

asar: true

# 产物只含 dist，运行时不需要 node_modules，跳过依赖重建显著加快打包
npmRebuild: false

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

win:
  target:
    - nsis
