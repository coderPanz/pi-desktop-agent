name: CI

on:
  push:
    # 四个长期分支都要跑：develop 集成、test 测试、gray 灰度、main 稳定。
    branches: [main, develop, test, gray]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须是真实发布的 Node 版本（nodejs.org/dist）。注意别和 `@types/node` 的版本号搞混。
  NODE_VERSION: "22.23.4"

jobs:
  verify:
    name: typecheck / lint / test / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 这些检查不需要 Electron 二进制，跳过下载能省一分钟以上。
      # 需要二进制的检查在下面的 desktop 任务里单独跑。
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # 端到端冒烟：真实装配 storage → open → resume → root，跑一遍 REPL 命令。
      # 不联网、不需要模型凭证（--memory + 只有 /list /new 这类无模型操作）。
      - name: Smoke
        run: pnpm smoke

  desktop:
    name: build desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 主进程构建脚本要读 Electron 可执行文件的路径，所以这个任务必须真下载二进制。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: apps/desktop/dist
          retention-days: 7
